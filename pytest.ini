[pytest]
markers =
    llm: needs a running Ollama/OpenAI backend (skipped in CI)
    live_llm: calls live external LLM API (requires GEMINI_API_KEY, skipped in CI)
    browser: requires live Playwright Chromium browser or running sandboxes (skipped in CI)
    e2e_socket: end-to-end tests that need real sockets
testpaths = tests
pythonpath = .
