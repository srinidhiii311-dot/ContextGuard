name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    env:
      JWT_SECRET: "ci-test-jwt-secret-minimum-16-characters"
      AUDIT_HMAC_SECRET: "ci-test-audit-hmac-secret-min-16-chars"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest ruff pytest-cov
      - name: Lint syntax & core errors
        run: python -m ruff check contextguard backend agent tests --select E9,F63,F7,F82
      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium
      - name: Run test suite (excluding live Ollama daemon)
        run: python -m pytest -m "not llm" -q --cov=contextguard --cov=backend
      - name: Smoke test LLM checker and borderline tests
        run: python -m pytest tests/kit/test_llm_checker.py tests/test_borderline_llm.py -q
