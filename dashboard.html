<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ContextGuard — Approvals & Security Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b0f17;
    --surface: #111827;
    --card: #1a2234;
    --border: #334155;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --teal: #38bdf8;
    --green: #10b981;
    --red: #ef4444;
    --warn: #f59e0b;
    --purple: #a855f7;
  }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    padding-bottom: 16px;
    margin-bottom: 24px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand h1 { font-size: 20px; font-weight: 700; color: var(--teal); }
  .nav-links a { color: var(--muted); text-decoration: none; margin-left: 16px; font-size: 14px; }
  .nav-links a:hover { color: var(--teal); }
  
  #approvals-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    max-width: 900px;
    margin: 0 auto;
  }
  #approvals-panel h3 { font-size: 18px; margin-bottom: 16px; color: var(--text); }
  #login-box {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    background: var(--card);
    padding: 12px;
    border-radius: 6px;
  }
  #login-box input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 4px;
    font-size: 14px;
  }
  button {
    background: var(--teal);
    color: #0b0f17;
    border: none;
    padding: 8px 16px;
    border-radius: 4px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  button:hover { opacity: 0.9; }
  #approvals-list > div {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 14px;
    border-radius: 6px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .btn-approve { background: var(--green); color: white; margin-left: 8px; }
  .btn-deny { background: var(--red); color: white; margin-left: 8px; }
</style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span style="font-size:24px;">🛡️</span>
      <h1>ContextGuard Security & Approvals Dashboard</h1>
    </div>
    <div class="nav-links">
      <a href="/portal">Launchpad</a>
      <a href="/live">Live Agent</a>
      <a href="/audit">Audit Ledger</a>
      <a href="/report">Detection Report</a>
    </div>
  </div>

<!-- Paste into dashboard.html. Buttons render only for roles allowed to decide. -->
<section id="approvals-panel">
  <h3>Pending approvals</h3>
  <div id="login-box">
    <input id="u" placeholder="username"><input id="p" type="password" placeholder="password">
    <button onclick="cgLogin()">Sign in</button>
  </div>
  <div id="approvals-list"></div>
</section>
<script>
let CG_TOKEN = null, CG_ROLE = null;
async function cgLogin() {
  const r = await fetch('/api/auth/login', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username: u.value, password: p.value})});
  if (!r.ok) { alert('Login failed'); return; }
  const j = await r.json(); CG_TOKEN = j.access_token; CG_ROLE = j.role; cgLoad();
}
const cgAuth = () => ({'Authorization': 'Bearer ' + CG_TOKEN, 'Content-Type': 'application/json'});
async function cgLoad() {
  const r = await fetch('/api/approvals?status=PENDING', {headers: cgAuth()});
  const items = await r.json(), box = document.getElementById('approvals-list'); box.textContent = '';
  for (const a of items) {
    const d = document.createElement('div');
    d.textContent = `#${a.id} task ${a.task_id} step ${a.step} risk ${a.risk_score} needs ${a.required} approval(s): ` +
                    JSON.stringify(a.action);
    if (['approver', 'admin'].includes(CG_ROLE)) {
      for (const dec of ['APPROVE', 'DENY']) {
        const b = document.createElement('button'); b.textContent = dec;
        b.className = dec === 'APPROVE' ? 'btn-approve' : 'btn-deny';
        b.onclick = async () => {
          const reason = prompt('Reason (required):'); if (!reason) return;
          const x = await fetch(`/api/approvals/${a.id}/decision`, {method: 'POST', headers: cgAuth(),
            body: JSON.stringify({decision: dec, reason})});
          if (!x.ok) alert((await x.json()).detail); cgLoad();
        };
        d.appendChild(b);
      }
    }
    box.appendChild(d);
  }
}
setInterval(() => CG_TOKEN && cgLoad(), 5000);
</script>
</body>
</html>
