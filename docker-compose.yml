services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports: ["8000:8000"]
    env_file: .env
    environment:
      OLLAMA_URL: http://ollama:11434
      DB_PATH: /data/contextguard.db
    volumes:
      - cg_data:/data
    depends_on: [ollama]
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    ports: ["11434:11434"]
volumes:
  cg_data:
  ollama_models:
# After `docker compose up -d`:  docker compose exec ollama ollama pull llama3.1:8b
